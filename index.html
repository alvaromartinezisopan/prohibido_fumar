<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prohibido Fumar</title>
    <style>
        /* Reseteo y fuentes de Apple */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body, html {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
            background-color: #ffffff; 
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            
            /* MARGEN LLEVADO AL LÍMITE: 32px es el mínimo estricto para que el brillo de 30px no se corte */
            padding: clamp(32px, 3vw, 40px); 
            
            overflow: hidden;
        }

        /* Contenedor principal */
        .card-container {
            position: relative;
            width: 100%;
            height: 100%;
            
            /* Ancho máximo ampliado para aprovechar monitores grandes */
            max-width: 1600px; 
            
            background-color: #ffffff; 
            border-radius: clamp(24px, 4vw, 48px);
            
            /* Borde rojo brillante de aviso */
            border: clamp(6px, 0.7vw, 7px) solid #ff3b30;
            
            overflow: hidden;
            
            /* SOMBRA Y BRILLO: Halo rojo intenso de 30px */
            box-shadow: 
                0 15px 35px rgba(0, 0, 0, 0.05),
                0 0 30px rgba(255, 59, 48, 0.9), 
                inset 0 2px 4px rgba(255, 255, 255, 0.8);
                
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            
            padding: clamp(24px, 5vh, 64px) clamp(12px, 2vw, 30px);
            text-align: center;
            overflow-y: auto;
            scrollbar-width: none;
        }

        .card-container::-webkit-scrollbar {
            display: none;
        }

        /* Reflejo de luz cenital superior */
        .card-container::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; height: 18vh;
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.75) 0%, rgba(255, 255, 255, 0) 100%);
            pointer-events: none;
            z-index: 1;
        }

        /* --- CONTENIDO --- */
        .header {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: clamp(8px, 2vh, 20px);
            position: relative;
            z-index: 2;
            width: 100%;
        }

        /* Símbolo ampliado con sombras */
        .icon {
            width: clamp(90px, 24vmin, 220px);
            height: clamp(90px, 24vmin, 220px);
            filter: drop-shadow(0 12px 24px rgba(0, 0, 0, 0.15)) 
                    drop-shadow(0 4px 12px rgba(255, 59, 48, 0.35));
            flex-shrink: 0;
        }

        /* Título Fluido */
        h1 {
            color: #1d1d1f;
            font-size: clamp(2.5rem, 7vmin, 5.5rem);
            font-weight: 900;
            line-height: 0.95;
            letter-spacing: -0.05em;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.08);
        }

        /* Cuerpo del texto */
        .content-body {
            display: flex;
            flex-direction: column;
            gap: clamp(10px, 2.5vh, 28px);
            margin: auto 0;
            position: relative;
            z-index: 2;
            width: 100%;
        }

        /* Foco en NINGUNA ZONA */
        .highlight {
            color: #ff3b30;
            font-size: clamp(1.6rem, 5.5vmin, 4rem);
            font-weight: 900;
            text-transform: uppercase;
            line-height: 1;
            letter-spacing: -0.03em;
            text-shadow: 0 2px 12px rgba(255, 59, 48, 0.3);
        }

        .subtitle {
            color: #3a3a3c;
            font-size: clamp(1.2rem, 3.2vmin, 2.2rem); 
            font-weight: 500;
            line-height: 1.4;
            max-width: 800px;
            margin: 0 auto;
            text-shadow: 0 1px 2px rgba(255, 255, 255, 0.6);
        }

        /* Fecha minimizada */
        .footer {
            color: #636366;
            font-size: clamp(0.75rem, 2vmin, 1.2rem);
            font-weight: 600;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            position: relative;
            z-index: 2;
            margin-top: clamp(16px, 4vh, 32px);
            flex-shrink: 0;
            text-shadow: 0 1px 2px rgba(255, 255, 255, 0.5);
        }

        /* ========================================================
           ADAPTACIÓN A TARJETA DE NOTIFICACIÓN (Estilo iPhone)
           ======================================================== */
        @media (max-width: 600px), (max-height: 400px) {
            .card-container {
                display: grid;
                grid-template-columns: min-content 1fr;
                grid-template-areas:
                    "icon header"
                    "icon body"
                    "icon footer";
                align-content: center;
                text-align: left;
                padding: 16px 12px;
                gap: 4px 12px; 
                border-radius: 20px;
                border-width: 2px;
            }

            .card-container::before {
                display: none; 
            }

            .header {
                display: contents; 
            }

            .icon {
                grid-area: icon;
                width: 45px; 
                height: 45px;
                align-self: start;
                margin-top: 4px; 
            }

            h1 {
                grid-area: header;
                font-size: 1.1rem;
                line-height: 1.2;
            }

            h1 br {
                display: none; 
            }

            .content-body {
                grid-area: body;
                margin: 0;
                gap: 2px;
            }

            .highlight {
                font-size: 0.95rem;
                text-shadow: none; 
            }

            .subtitle {
                font-size: 0.85rem;
                line-height: 1.3;
                max-width: 100%;
            }

            .footer {
                grid-area: footer;
                margin-top: 4px;
                font-size: 0.7rem;
            }
        }
    </style>
</head>
<body>

    <div class="card-container">
        <div class="header">
            <!-- Icono SVG de prohibido fumar -->
            <svg class="icon" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                <circle cx="50" cy="50" r="42" stroke="#ff3b30" stroke-width="10" fill="none" />
                <rect x="30" y="46" width="40" height="8" rx="2" fill="#1d1d1f" />
                <rect x="58" y="46" width="12" height="8" rx="2" fill="#86868b" />
                <path d="M 35 40 Q 30 30 40 25 T 35 15" stroke="#86868b" stroke-width="2" fill="none" stroke-linecap="round" />
                <path d="M 45 40 Q 50 30 40 25 t 5 -10" stroke="#86868b" stroke-width="2" fill="none" stroke-linecap="round" />
                <line x1="20" y1="20" x2="80" y2="80" stroke="#ff3b30" stroke-width="10" />
            </svg>

            <h1>PROHIBIDO <br>FUMAR</h1>
        </div>

        <div class="content-body">
            <div class="highlight">En todo el recinto</div>
            <div class="subtitle">
                Queda terminantemente prohibido, ni siquiera en los espacios que estaban habilitados previamente (interiores y exteriores)
            </div>
        </div>

        <div class="footer">
            Hasta el 7 de septiembre
        </div>
    </div>

</body>
</html>

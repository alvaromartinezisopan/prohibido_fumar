<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prohibido Fumar</title>
    <style>
        /* Reseteo y fuentes de Apple */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body, html {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
            background-color: #ffffff; 
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            
            /* Margen holgado para que el brillo más suave y contenido no se corte */
            padding: clamp(24px, 3vw, 36px); 
            
            overflow: hidden;
        }

        /* Contenedor principal */
        .card-container {
            position: relative;
            width: 100%;
            height: 100%;
            
            /* Ancho máximo ampliado para aprovechar monitores grandes */
            max-width: 1600px; 
            
            background-color: #ffffff; 
            border-radius: clamp(24px, 4vw, 48px);
            
            /* Borde rojo brillante de aviso */
            border: clamp(6px, 0.7vw, 7px) solid #ff3b30;
            
            overflow: hidden;
            
            /* SOMBRA Y BRILLO REDUCIDO: Halo suavizado de 15px para que no se corte */
            box-shadow: 
                0 10px 25px rgba(0, 0, 0, 0.05),
                0 0 20px rgba(255, 59, 48, 1), 
                inset 0 2px 4px rgba(255, 255, 255, 0.8);
                
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            
            padding: clamp(20px, 4vh, 50px) clamp(12px, 2vw, 30px);
            text-align: center;
            overflow-y: auto;
            scrollbar-width: none;
        }

        .card-container::-webkit-scrollbar {
            display: none;
        }

        /* Reflejo de luz cenital superior */
        .card-container::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; height: 18vh;
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.75) 0%, rgba(255, 255, 255, 0) 100%);
            pointer-events: none;
            z-index: 1;
        }

        /* --- CONTENIDO --- */
        .header {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: clamp(8px, 2vh, 20px);
            position: relative;
            z-index: 2;
            width: 100%;
        }

        /* Símbolo ampliado con sombras */
        .icon {
            width: clamp(90px, 24vmin, 220px);
            height: clamp(90px, 24vmin, 220px);
            object-fit: contain; /* Mantiene la proporción de la imagen PNG */
            filter: drop-shadow(0 12px 24px rgba(0, 0, 0, 0)) 
                    drop-shadow(0 4px 12px rgba(255, 59, 48, 0));
            flex-shrink: 0;
        }

        /* Título Fluido */
        h1 {
            color: #1d1d1f;
            font-size: clamp(2.5rem, 7vmin, 5.5rem);
            font-weight: 900;
            line-height: 0.95;
            letter-spacing: -0.05em;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.08);
        }

        /* Cuerpo del texto */
        .content-body {
            display: flex;
            flex-direction: column;
            gap: clamp(10px, 2.5vh, 28px);
            margin: auto 0;
            position: relative;
            z-index: 2;
            width: 100%;
        }

        /* Foco en NINGUNA ZONA */
        .highlight {
            color: #ff3b30;
            font-size: clamp(1.6rem, 5.5vmin, 4rem);
            font-weight: 900;
            text-transform: uppercase;
            line-height: 1;
            letter-spacing: -0.03em;
            text-shadow: 0 2px 12px rgba(255, 59, 48, 0.3);
        }

        .subtitle {
            color: #3a3a3c;
            font-size: clamp(1.2rem, 3.2vmin, 2.2rem); 
            font-weight: 500;
            line-height: 1.4;
            max-width: 800px;
            margin: 0 auto;
            text-shadow: 0 1px 2px rgba(255, 255, 255, 0.6);
        }

        /* Fecha en negrita y destacada */
        .footer {
            color: #1d1d1f;
            font-size: clamp(1rem, 2vmin, 1.3rem);
            font-weight: 800;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            position: relative;
            z-index: 2;
            margin-top: clamp(8px, 2vh, 16px);
            flex-shrink: 0;
            text-shadow: 0 1px 2px rgba(255, 255, 255, 0.5);
        }

        /* ========================================================
           ADAPTACIÓN A TARJETA DE NOTIFICACIÓN (Estilo iPhone)
           ======================================================== */
        @media (max-width: 600px), (max-height: 400px) {
            .card-container {
                display: grid;
                grid-template-columns: min-content 1fr;
                grid-template-areas:
                    "icon header"
                    "icon body"
                    "icon footer";
                align-content: center;
                text-align: left;
                padding: 12px;
                gap: 4px 12px; 
                border-radius: 20px;
                border-width: 2px;
            }

            .card-container::before {
                display: none; 
            }

            .header {
                display: contents; 
            }

            .icon {
                grid-area: icon;
                width: 45px; 
                height: 45px;
                align-self: start;
                margin-top: 4px; 
            }

            h1 {
                grid-area: header;
                font-size: 1.1rem;
                line-height: 1.2;
            }

            h1 br {
                display: none; 
            }

            .content-body {
                grid-area: body;
                margin: 0;
                gap: 2px;
            }

            .highlight {
                font-size: 0.95rem;
                text-shadow: none; 
            }

            .subtitle {
                font-size: 0.85rem;
                line-height: 1.3;
                max-width: 100%;
            }

            .footer {
                grid-area: footer;
                margin-top: 2px;
                font-size: 0.75rem;
            }
        }
    </style>
</head>
<body>

    <div class="card-container">
        <div class="header">
            <!-- Icono PNG -->
            <img class="icon" src="https://cdn.pixabay.com/photo/2021/11/06/06/19/signage-6772535_1280.png" alt="Prohibido Fumar">

            <h1>PROHIBIDO <br>FUMAR</h1>
        </div>

        <div class="content-body">
            <div class="highlight">En todo el recinto</div>
            <div class="subtitle">
                Queda terminantemente prohibido, ni siquiera en los espacios que estaban habilitados previamente (interiores y exteriores)
            </div>
        </div>

        <div class="footer">
            Desde el 3 de agosto hasta el 7 de septiembre
        </div>
    </div>

</body>
</html>

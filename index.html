<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prohibido Fumar</title>
    <style>
        /* Reseteo y fuentes de Apple */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body, html {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
            background-color: #ffffff; /* Fondo de la página estrictamente blanco puro */
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: clamp(10px, 3vw, 40px);
            overflow: hidden;
        }

        /* Contenedor principal con el color gris exacto #d4d4d4 */
        .card-container {
            position: relative;
            width: 100%;
            height: 100%;
            max-width: 1200px;
            background-color: #d4d4d4; 
            border-radius: clamp(24px, 4vw, 48px);
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.08), 
                        0 0 0 1px rgba(0, 0, 0, 0.04);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: clamp(24px, 5vh, 64px) clamp(20px, 4vw, 60px);
            text-align: center;
            overflow-y: auto;
            scrollbar-width: none;
        }

        .card-container::-webkit-scrollbar {
            display: none;
        }

        /* Reflejo superior sutil para mantener el toque premium de Apple */
        .card-container::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; height: 15vh;
            background: linear-gradient(180deg, rgba(255,255,255,0.7) 0%, transparent 100%);
            pointer-events: none;
            z-index: 1;
        }

        /* --- CONTENIDO --- */
        .header {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: clamp(8px, 2vh, 20px);
            position: relative;
            z-index: 2;
            width: 100%;
        }

        /* Símbolo ampliado de forma fluida */
        .icon {
            width: clamp(90px, 24vmin, 220px);
            height: clamp(90px, 24vmin, 220px);
            filter: drop-shadow(0 10px 20px rgba(255, 59, 48, 0.25));
            flex-shrink: 0;
        }

        /* Título Fluido */
        h1 {
            color: #1d1d1f;
            font-size: clamp(2rem, 7vmin, 5.5rem);
            font-weight: 900;
            line-height: 0.95;
            letter-spacing: -0.05em;
        }

        /* Cuerpo del texto */
        .content-body {
            display: flex;
            flex-direction: column;
            gap: clamp(10px, 2.5vh, 28px);
            margin: auto 0;
            position: relative;
            z-index: 2;
            width: 100%;
        }

        /* Foco extremo en NINGUNA ZONA */
        .highlight {
            color: #ff3b30;
            font-size: clamp(1.6rem, 5.5vmin, 4rem);
            font-weight: 900;
            text-transform: uppercase;
            line-height: 1;
            letter-spacing: -0.03em;
        }

        .subtitle {
            color: #3a3a3c;
            font-size: clamp(1rem, 2.8vmin, 1.7rem);
            font-weight: 500;
            line-height: 1.4;
            max-width: 800px;
            margin: 0 auto;
        }

        /* Fecha minimizada al máximo */
        .footer {
            color: #636366;
            font-size: clamp(0.75rem, 2vmin, 1.2rem);
            font-weight: 600;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            position: relative;
            z-index: 2;
            margin-top: clamp(16px, 4vh, 32px);
            flex-shrink: 0;
        }
    </style>
</head>
<body>

    <div class="card-container">
        <div class="header">
            <!-- Icono SVG de prohibido fumar ampliado -->
            <svg class="icon" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                <circle cx="50" cy="50" r="42" stroke="#ff3b30" stroke-width="10" fill="none" />
                <rect x="30" y="46" width="40" height="8" rx="2" fill="#1d1d1f" />
                <rect x="58" y="46" width="12" height="8" rx="2" fill="#86868b" />
                <path d="M 35 40 Q 30 30 40 25 T 35 15" stroke="#86868b" stroke-width="2" fill="none" stroke-linecap="round" />
                <path d="M 45 40 Q 50 30 40 25 t 5 -10" stroke="#86868b" stroke-width="2" fill="none" stroke-linecap="round" />
                <line x1="20" y1="20" x2="80" y2="80" stroke="#ff3b30" stroke-width="10" />
            </svg>

            <h1>PROHIBIDO<br>FUMAR</h1>
        </div>

        <div class="content-body">
            <div class="highlight">En ninguna zona</div>
            <div class="subtitle">
                Queda terminantemente prohibido, ni siquiera en los espacios que estaban habilitados previamente.
            </div>
        </div>

        <div class="footer">
            Hasta el 7 de septiembre
        </div>
    </div>

</body>
</html>
